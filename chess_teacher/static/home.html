<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Teacher</title>
  <script src="/static/settings.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="brand" href="/"><span class="logo"><img src="/static/pieces/bN.svg" alt=""></span>Chess Teacher</a>
      <div class="links">
        <a href="/" class="active" aria-current="page">Play</a>
        <a href="/openings">Openings</a>
        <a href="/analysis">Analysis</a>
      </div>
      <a href="/settings" class="settings-link" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></a>
    </nav>
  </header>

  <main class="home">
    <div class="play">
      <div class="player" id="top-player"></div>
      <div class="board-area">
        <div id="board" class="board playable" aria-label="Chess board"></div>
        <svg class="arrows" viewBox="0 0 8 8" aria-hidden="true">
          <defs>
            <marker id="head-best" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="arrow-best-head"/></marker>
            <marker id="head-user" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="arrow-user-head"/></marker>
          </defs>
          <g id="arrow-layer"></g>
        </svg>
        <div id="promotion" class="promotion" hidden></div>
      </div>
      <div class="player">
        <div class="player" id="bottom-player"></div>
        <strong id="status" class="turn" aria-live="polite"></strong>
      </div>
      <p id="error" class="error" hidden></p>
    </div>

    <div class="play-side">
      <section class="card setup" aria-label="Game setup">
        <h1>Play a game</h1>
        <div class="segmented" role="group" aria-label="Opponent">
          <button data-mode="human">Two players</button>
          <button data-mode="engine">vs Stockfish</button>
        </div>
        <div id="engine-settings" class="setup" hidden>
          <div class="elo-head">
            <label for="elo" class="field-label">Engine strength</label>
            <strong id="elo-value"></strong>
          </div>
          <input type="range" id="elo" min="400" max="3000" step="50">
          <div class="elo-scale">
            <span>400 · Beginner</span>
            <span id="elo-note" class="elo-note">≈ Approximate below 1320</span>
            <span>3000 · Grandmaster+</span>
          </div>
          <p id="elo-locked" class="muted small" hidden>Strength is set for this game. Start a new game to change it.</p>
          <button id="start-engine" class="primary" hidden>Start</button>
          <p class="field-label" style="margin: 18px 0 8px">You play</p>
          <div class="sides" role="group" aria-label="Your side">
            <button data-color="white"><img src="/static/pieces/wK.svg" alt="">White</button>
            <button data-color="black"><img src="/static/pieces/bK.svg" alt="">Black</button>
            <button data-color="random">Random</button>
          </div>
        </div>
        <p id="opponent" class="muted small"></p>
      </section>

      <section class="card game-card" aria-label="This game">
        <div class="opening" id="opening"></div>
        <p id="moves" class="line"></p>
      </section>

      <div class="actions">
        <button id="best-move" title="Show Stockfish's best move for you in this position" hidden>Best move</button>
        <button id="undo">Undo</button>
        <button id="flip">Flip</button>
        <button id="reset">New game</button>
      </div>
      <button id="to-analysis" class="primary">Analyze this game</button>
    </div>
  </main>

  <script src="/static/board.js"></script>
  <script src="/static/home.js"></script>
</body>
</html>
