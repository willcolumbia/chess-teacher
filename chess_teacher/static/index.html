<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Teacher</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1>Chess Teacher</h1>
    <p class="muted">Paste a Chess.com PGN to see where you went wrong, what to play instead, and why.</p>
  </header>

  <main>
    <section class="card" id="input">
      <label for="pgn">Game PGN</label>
      <textarea id="pgn" rows="8" spellcheck="false"
        placeholder="On Chess.com: open the game → Share → PGN → Copy, then paste here."></textarea>
      <div class="row">
        <label class="file">
          <input type="file" id="file" accept=".pgn,text/plain">
          <span>Or load a .pgn file</span>
        </label>
        <label>Your username
          <input type="text" id="username" placeholder="Chess.com username" autocomplete="off">
        </label>
        <label>Depth
          <select id="depth">
            <option value="12">Fast</option>
            <option value="16" selected>Normal</option>
            <option value="20">Deep</option>
          </select>
        </label>
        <button id="analyze" class="primary">Analyze game</button>
      </div>
      <div id="progress" class="progress" hidden><div class="bar"></div><span class="label"></span></div>
      <p id="error" class="error" hidden></p>
    </section>

    <section id="results" hidden>
      <div class="board-col">
        <div class="player" id="top-player"></div>
        <div class="board-wrap">
          <div class="evalbar"><div class="white-fill"></div><span class="eval-text"></span></div>
          <div class="board-area">
            <div id="board" class="board"></div>
            <svg id="arrows" class="arrows" viewBox="0 0 8 8" aria-hidden="true">
              <defs>
                <marker id="head-best" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="arrow-best-head"/></marker>
                <marker id="head-played" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="arrow-played-head"/></marker>
              </defs>
              <g id="arrow-layer"></g>
            </svg>
          </div>
        </div>
        <div class="player" id="bottom-player"></div>
        <div class="nav">
          <button data-nav="start" title="Start (Home)">⏮</button>
          <button data-nav="prev" title="Previous (←)">◀</button>
          <button data-nav="next" title="Next (→)">▶</button>
          <button data-nav="end" title="End (End)">⏭</button>
          <button data-nav="mistake" title="Next mistake (n)">Next mistake</button>
          <button data-nav="flip" title="Flip board (f)">Flip</button>
        </div>
        <p class="caption muted" id="caption"></p>
      </div>

      <div class="panel-col">
        <div class="summary" id="summary"></div>
        <div class="card detail" id="detail"></div>
        <div class="card">
          <div class="list-head">
            <h2>Moves</h2>
            <label class="toggle"><input type="checkbox" id="only-mine"> Only my mistakes</label>
          </div>
          <div id="moves" class="moves"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
