<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Openings · Chess Teacher</title>
  <script src="/static/settings.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="brand" href="/"><span class="logo"><img src="/static/pieces/bN.svg" alt=""></span>Chess Teacher</a>
      <div class="links">
        <a href="/">Play</a>
        <a href="/openings" class="active" aria-current="page">Openings</a>
        <a href="/analysis">Analysis</a>
      </div>
      <a href="/settings" class="settings-link" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></a>
    </nav>
  </header>

  <!-- Pick an opening -->
  <section id="screen-pick" class="screen">
    <h1>Openings</h1>
    <p class="muted">Pick a side, a mode and an opening.</p>
    <div class="row pick-controls">
      <div class="segmented" role="group" aria-label="Your side">
        <button data-side="white">I play White</button>
        <button data-side="black">I play Black</button>
      </div>
      <div class="segmented" role="group" aria-label="Mode">
        <button data-mode="learn" title="The coach shows each move and why; you play it">Learn</button>
        <button data-mode="practice" title="Find the moves yourself; hints if you need them">Practice</button>
      </div>
    </div>
    <div id="opening-list" class="opening-list"></div>
    <p id="pick-error" class="error" hidden></p>
  </section>

  <!-- Drill -->
  <section id="screen-drill" class="screen" hidden>
    <header class="walk-head">
      <div>
        <h1 id="drill-title"></h1>
        <span class="chip" id="drill-variation" hidden></span>
        <span class="chip" id="drill-book"></span>
      </div>
      <button id="choose">Choose another opening</button>
    </header>
    <div class="progress small-progress"><div class="bar" id="drill-progress"></div></div>

    <div class="walk">
      <div class="board-col">
        <div class="player" id="top-player"></div>
        <div class="board-area">
          <div id="board" class="board playable" aria-label="Chess board"></div>
          <svg id="arrows" class="arrows" viewBox="0 0 8 8" aria-hidden="true">
            <defs>
              <marker id="head-last" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="arrow-last-head"/></marker>
              <marker id="head-best" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="arrow-best-head"/></marker>
              <marker id="head-user" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="arrow-user-head"/></marker>
              <marker id="head-played" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="arrow-played-head"/></marker>
            </defs>
            <g id="arrow-layer"></g>
          </svg>
        </div>
        <div class="player" id="bottom-player"></div>
        <p class="caption muted" id="caption"></p>
        <div class="row board-buttons">
          <button id="restart">Restart</button>
          <button id="flip">Flip</button>
        </div>
      </div>

      <div class="card coach">
        <div id="log" class="log"></div>
        <div id="prompt" class="prompt"></div>
        <p id="drill-error" class="error" hidden></p>
      </div>
    </div>
  </section>

  <script src="/static/board.js"></script>
  <script src="/static/openings.js"></script>
</body>
</html>
